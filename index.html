<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка капчи</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #3887be);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            text-align: center;
            max-width: 320px;
            width: 100%;
            padding: 24px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--hint-color);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .spinner {
            display: none;
            margin: 20px auto;
            width: 32px;
            height: 32px;
            border: 3px solid var(--hint-color);
            border-top: 3px solid var(--button-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #status-text {
            font-size: 14px;
            margin-top: 15px;
            font-weight: 500;
        }

        .cf-turnstile {
            display: flex;
            justify-content: center;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="title"></h2>
        <p id="description"></p>
        <div class="cf-turnstile" 
             data-sitekey="0x4AAAAAAFTCCh6gVu-7eYzM" 
             data-callback="onCaptchaSuccess" 
             data-language="ru"
             data-theme="flexible">
        </div>

        <div class="spinner" id="loading-spinner"></div>
        <div id="status-text"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lang = urlParams.get('lang') || 'ru';
        const translations = {
            ru: {
                title: 'Подтверждение',
                description: 'Пожалуйста, пройдите проверку ниже, чтобы получить доступ к чату.',
                sending: 'Проверка успешна, отправка данных...',
                error: 'Ошибка отправки данных. Попробуйте снова.'
            },
            en: {
                title: 'Verification',
                description: 'Please complete the verification below to access the chat.',
                sending: 'Verification successful, sending data...',
                error: 'Error sending data. Please try again.'
            }
        };
        const currentLang = Object.prototype.hasOwnProperty.call(translations, lang) ? lang : 'ru';
        const text = translations[currentLang];
        const chatId = urlParams.get('chat_id') || null;
        const captchaId = urlParams.get('captcha_id') || null;
        const tg = window.Telegram.WebApp;

        document.documentElement.lang = currentLang;
        document.title = text.title;
        document.getElementById('title').innerText = text.title;
        document.getElementById('description').innerText = text.description;
        document.querySelector('.cf-turnstile').dataset.language = currentLang;

        tg.expand();
        function onCaptchaSuccess(token) {
            document.querySelector('.cf-turnstile').style.display = 'none';
            document.getElementById('loading-spinner').style.display = 'block';
            document.getElementById('status-text').style.color = 'var(--text-color)';
            document.getElementById('status-text').innerText = text.sending;

            try {
                tg.sendData(JSON.stringify({ 
                    status: "success",
                    token: token ,
                    chatId: chatId,
                    captchaId: captchaId
                }));
            } catch (e) {
                document.getElementById('status-text').innerText = text.error;
                document.getElementById('loading-spinner').style.display = 'none';
            }
        }
    </script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
